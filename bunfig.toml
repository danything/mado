# 整形 (`bun fmt`。`package.json` の format・lint から呼ぶ)。書き方は既定のまま、外すものだけ。
# 見るのは画面 (web/) と一番上の JSON だけ (biome のときと同じ)
[fmt]
# import を並べ替える (組の分け方は既定のまま。副作用だけの import は動かさない)
sortImports = true
ignorePatterns = [
  ".github/",
  "docs/",
  "installer/",
  "server/",
  "tests/",
  "tools/",
  "tray/",
  "README.md",
]
