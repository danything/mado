name: Check

# PR ごと。main に入ったあとは release.yml が試験とビルドをもう一度やって(版が新しければ)リリースする
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        # bun fmt (bun run lint) は 1.4.4 から
        with:
          bun-version: 1.4.4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403
      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.nuget/packages
          key: check-${{ runner.os }}-${{ hashFiles('bun.lock', '**/*.csproj') }}
          restore-keys: check-${{ runner.os }}-
      - run: bun i --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun test web
      # 画面を先に作る(server が exe に埋め込む)
      - run: bun run build:web
      # TUnit はテストプロジェクト自体が実行ファイル
      - run: dotnet run --project tests/Mado.Tests.csproj

  # Windows 用の exe(Native AOT)と MSI が作れること。作ったものは捨てる(配るのは release.yml)
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403
      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.nuget/packages
            ~/.dotnet/tools
            ~/.wix
          key: package-${{ runner.os }}-${{ hashFiles('bun.lock', '**/*.csproj') }}-wix5.0.2
          restore-keys: package-${{ runner.os }}-
      - run: bun i --frozen-lockfile
      - run: bun run build:web
      # Windows でも試験を回す(CNG など、Linux と違うところで落ちることがある)
      - run: dotnet run --project tests/Mado.Tests.csproj
      - run: dotnet publish server/Mado.csproj -c Release -r win-x64 -o publish
      - run: dotnet publish tray/MadoTray.csproj -c Release -r win-x64 -o publish
      - shell: pwsh
        run: |
          # キャッシュに入っていれば入れ直さない(PATH に載っているかに頼らず、ファイルで見る)
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          if (-not (Test-Path (Join-Path $tools 'wix.exe'))) { dotnet tool install --global wix --version 5.0.2 }
          $env:PATH = "$tools;$env:PATH"
          wix extension add -g WixToolset.Firewall.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          $version = ([xml](Get-Content server/Mado.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          wix build installer/mado.wxs -arch x64 -ext WixToolset.Firewall.wixext -ext WixToolset.Util.wixext `
            -d Version=$version -d PublishDir=publish -o dist/mado.msi
          Get-Item publish/mado.exe, publish/mado-tray.exe, dist/mado.msi | ForEach-Object { "{0} {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
