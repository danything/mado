name: Release

# v* のタグで MSI を作り、リリースに載せる。
# - mado.msi: サービス・ファイアウォール・ProgramData の権限まで入れる(installer/mado.wxs)
# - mado.msi.sha256 と出どころの証明(gh attestation verify): 入れる側(gitops の setup.ps1)が確かめる
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - id: version
        shell: pwsh
        run: |
          # exe と MSI に入る版(server/Mado.csproj)とタグが食い違わないこと
          $version = ([xml](Get-Content server/Mado.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "タグ $env:GITHUB_REF_NAME と Mado.csproj の版 $version が違う" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: bun i --frozen-lockfile
      - run: bun run build:web
      - run: dotnet run --project tests/Mado.Tests.csproj
      - run: dotnet publish server/Mado.csproj -c Release -r win-x64 -o publish
      - run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - shell: pwsh
        run: |
          wix build installer/mado.wxs -arch x64 -ext WixToolset.Firewall.wixext -ext WixToolset.Util.wixext `
            -d Version=${{ steps.version.outputs.version }} -d PublishDir=publish -o dist/mado.msi
          (Get-FileHash dist/mado.msi -Algorithm SHA256).Hash.ToLower() + '  mado.msi' | Set-Content dist/mado.msi.sha256 -NoNewline
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/mado.msi
      - shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/mado.msi dist/mado.msi.sha256 --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
