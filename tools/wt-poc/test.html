<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebTransport 試験</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
  pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; }
  input { width: 40em; max-width: 100%; }
</style>
</head>
<body>
<h1>WebTransport 試験</h1>
<p>
  URL <input id="url"><br>
  hash <input id="hash" placeholder="証明書の SHA-256 (16 進)"><br>
  <button id="run">接続して試す</button>
</p>
<pre id="log"></pre>
<script>
// 使い方: test.html?hash=<16進>&url=https://127.0.0.1:4433/wt
// hash を省くと、このページを返したサーバーの /hash から読む
const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
$("url").value = q.get("url") || "https://127.0.0.1:4433/wt";
$("hash").value = q.get("hash") || "";
const t0 = performance.now();
function log(s) {
  const line = `${(performance.now() - t0).toFixed(1).padStart(8)} ms  ${s}`;
  $("log").textContent += line + "\n";
  console.log(line);
}

function hexToBytes(hex) {
  const b = new Uint8Array(hex.length / 2);
  for (let i = 0; i < b.length; i++) b[i] = parseInt(hex.substr(i * 2, 2), 16);
  return b;
}

async function readAll(readable) {
  const reader = readable.getReader();
  const chunks = [];
  let n = 0;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    chunks.push(value);
    n += value.length;
  }
  const out = new Uint8Array(n);
  let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}

async function run() {
  let hash = $("hash").value.trim();
  if (!hash && location.protocol.startsWith("http")) {
    hash = (await (await fetch("/hash")).text()).trim();
    $("hash").value = hash;
  }
  if (!/^[0-9a-f]{64}$/i.test(hash)) { log("hash が無い"); return; }
  const url = $("url").value;
  log(`接続 ${url}`);
  const start = performance.now();
  const wt = new WebTransport(url, {
    serverCertificateHashes: [{ algorithm: "sha-256", value: hexToBytes(hash) }],
  });
  wt.closed.then((i) => log(`閉じた: ${JSON.stringify(i)}`)).catch((e) => log(`閉じた(誤り): ${e}`));
  try {
    await wt.ready;
  } catch (e) {
    log(`ready で失敗: ${e}`);
    return;
  }
  log(`ready ${(performance.now() - start).toFixed(1)} ms`);

  // 双方向 stream。書いて閉じ、返ってきたものを比べる
  for (const size of [5, 64 * 1024, 1024 * 1024]) {
    const t = performance.now();
    const s = await wt.createBidirectionalStream();
    const data = new Uint8Array(size);
    for (let i = 0; i < size; i++) data[i] = (i * 31 + 7) & 0xff;
    const w = s.writable.getWriter();
    const reading = readAll(s.readable);
    await w.write(data);
    await w.close();
    const back = await reading;
    const ok = back.length === size && back.every((v, i) => v === data[i]);
    log(`双方向 ${size} バイト: ${ok ? "一致" : `不一致 (${back.length} バイト)`} ${(performance.now() - t).toFixed(1)} ms`);
  }

  // 往復の時間。1 本の stream で 1 バイトを 20 回やりとりする
  {
    const s = await wt.createBidirectionalStream();
    const w = s.writable.getWriter();
    const r = s.readable.getReader();
    const times = [];
    for (let i = 0; i < 20; i++) {
      const t = performance.now();
      await w.write(new Uint8Array([i]));
      const { value } = await r.read();
      if (!value || value[0] !== i) { log(`往復 ${i}: 値が違う`); break; }
      times.push(performance.now() - t);
    }
    await w.close();
    times.sort((a, b) => a - b);
    log(`往復 20 回: 中央値 ${times[10].toFixed(2)} ms 最小 ${times[0].toFixed(2)} ms`);
  }

  // datagram。返ってくれば一致を見る
  try {
    const dw = wt.datagrams.writable.getWriter();
    const dr = wt.datagrams.readable.getReader();
    const t = performance.now();
    await dw.write(new TextEncoder().encode("ping"));
    const res = await Promise.race([dr.read(), new Promise((r) => setTimeout(() => r(null), 2000))]);
    if (res?.value) log(`datagram: ${new TextDecoder().decode(res.value)} ${(performance.now() - t).toFixed(1)} ms`);
    else log("datagram: 返らなかった");
    dw.releaseLock();
    dr.releaseLock();
  } catch (e) {
    log(`datagram の誤り: ${e}`);
  }

  // 単方向 stream。サーバーは別の単方向 stream で返す
  try {
    const incoming = wt.incomingUnidirectionalStreams.getReader();
    const u = await wt.createUnidirectionalStream();
    const w = u.getWriter();
    await w.write(new TextEncoder().encode("uni-hello"));
    await w.close();
    const { value } = await incoming.read();
    log(`単方向: ${new TextDecoder().decode(await readAll(value))}`);
  } catch (e) {
    log(`単方向の誤り: ${e}`);
  }

  wt.close({ closeCode: 7, reason: "done" });
  log("close を送った");
}

$("run").onclick = () => run().catch((e) => log(`誤り: ${e}`));
if (q.has("auto")) $("run").click();
</script>
</body>
</html>
