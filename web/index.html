<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>mado</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cg fill='none' stroke='%23fafafa' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='7' y='8' width='18' height='13' rx='2'/%3E%3Cpath d='M7 14.5h18M16 8v13M12 25h8'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="home" hidden>
      <div class="column">
        <header class="brand">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="14" rx="2" />
            <path d="M3 11h18M12 4v14M8 21h8" />
          </svg>
          <div>
            <h1>mado</h1>
            <p id="who"></p>
          </div>
        </header>
        <form id="login">
          <!-- つなぐ先の一覧。RDP の PC と Intel AMT が並ぶ(app.ts が作る) -->
          <fieldset
            id="target-field"
            role="radiogroup"
            aria-label="つなぐ先"
          ></fieldset>
          <label>
            <input
              name="username"
              autocomplete="username"
              placeholder=" "
              required
            />
            <span id="username-label">Windows のユーザー名</span>
          </label>
          <label>
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder=" "
              required
            />
            <span id="password-label">パスワード</span>
          </label>
          <button type="submit">接続</button>
          <p id="status" class="note" role="status"></p>
        </form>
        <footer>
          <a href="/logout">ログアウト</a> · <span id="version"></span>
        </footer>
      </div>
    </main>
    <nav id="toolbar" class="bar" hidden>
      <ul>
        <li><strong id="current" class="live"></strong></li>
      </ul>
      <ul>
        <li>
          <button type="button" class="secondary" data-action="ctrl-alt-del">
            Ctrl+Alt+Del
          </button>
        </li>
        <li>
          <button type="button" class="secondary" data-action="meta">
            Windows キー
          </button>
        </li>
        <li>
          <button type="button" class="secondary" data-action="diag">
            診断
          </button>
        </li>
        <li>
          <button type="button" class="secondary" data-action="fullscreen">
            全画面
          </button>
        </li>
        <li>
          <button type="button" class="secondary" data-action="disconnect">
            切断
          </button>
        </li>
      </ul>
    </nav>
    <!-- 初めて接続する先、または証明書が前と違うときに出す(app.ts の askCert) -->
    <dialog id="cert" aria-labelledby="cert-title" aria-describedby="cert-lead">
      <article>
        <header>
          <h2 id="cert-title"></h2>
        </header>
        <p id="cert-lead"></p>
        <dl id="cert-info"></dl>
        <footer>
          <button type="button" class="secondary" value="cancel">取消</button>
          <button type="button" value="trust"></button>
        </footer>
      </article>
    </dialog>
    <!-- Intel AMT の画面(amt/view.ts)。電源の状態と操作、SOL の端末 -->
    <section id="amt" hidden>
      <nav class="bar">
        <ul>
          <li><strong id="amt-name"></strong><span class="kind">AMT</span></li>
        </ul>
        <ul>
          <li>
            <button type="button" class="secondary" data-amt="refresh">
              更新
            </button>
          </li>
          <li>
            <button type="button" class="secondary" id="amt-sol" data-amt="sol">
              SOL に接続
            </button>
          </li>
          <li>
            <button type="button" class="secondary" data-amt="close">
              閉じる
            </button>
          </li>
        </ul>
      </nav>
      <div class="amt-section" id="amt-power">
        <p>
          <span>電源: <strong id="amt-state" data-on="false"></strong></span>
          <span id="amt-status" class="note" role="status"></span>
        </p>
        <div class="amt-actions" id="amt-actions"></div>
      </div>
      <div id="sol" hidden></div>
    </section>
    <!-- AMT の電源の操作の前に出す(amt/view.ts の ask) -->
    <dialog
      id="confirm"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-lead"
    >
      <article>
        <header>
          <h2 id="confirm-title"></h2>
        </header>
        <p id="confirm-lead"></p>
        <footer>
          <button type="button" class="secondary" value="cancel">取消</button>
          <button type="button" value="ok"></button>
        </footer>
      </article>
    </dialog>
    <div id="screen" class="idle"></div>
    <pre id="diag" hidden></pre>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
