<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>mado</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cg fill='none' stroke='%23fafafa' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='7' y='8' width='18' height='13' rx='2'/%3E%3Cpath d='M7 14.5h18M16 8v13M12 25h8'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="home" hidden>
      <div class="column">
        <header class="brand">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="14" rx="2" />
            <path d="M3 11h18M12 4v14M8 21h8" />
          </svg>
          <div>
            <h1>mado</h1>
            <p id="who"></p>
          </div>
        </header>
        <form id="login">
          <!-- つなぐ先の一覧。RDP の PC・Intel AMT・Talos のダッシュボードが並ぶ(app.ts が作る) -->
          <fieldset
            id="target-field"
            role="radiogroup"
            aria-label="つなぐ先"
          ></fieldset>
          <label id="username-field">
            <input
              name="username"
              autocomplete="username"
              placeholder=" "
              required
            />
            <span id="username-label">Windows のユーザー名</span>
          </label>
          <label id="password-field">
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder=" "
              required
            />
            <span id="password-label">パスワード</span>
          </label>
          <!-- ユーザー名とパスワードの保存(saved-login.ts)。このブラウザの中だけに暗号化して置き、mado には送らない。
               保存が使えないブラウザと、入れるものが無い先(Talos)では出さない。「保存を消去」は保存があるときだけ -->
          <div id="save-field" hidden>
            <label>
              <input type="checkbox" name="save" />
              パスワードをこの端末に保存する
            </label>
            <button type="button" class="secondary small" id="forget" hidden>
              保存を消去
            </button>
          </div>
          <p id="save-note" class="note" role="status"></p>
          <button type="submit">接続</button>
          <p id="status" class="note" role="status"></p>
        </form>
        <footer>
          <a href="/logout" id="logout">ログアウト</a> ·
          <span id="version"></span>
        </footer>
      </div>
    </main>
    <nav id="toolbar" class="bar overlay" hidden>
      <ul>
        <li><strong id="current" class="live"></strong></li>
      </ul>
      <ul>
        <li>
          <button type="button" class="secondary" data-action="ctrl-alt-del">
            Ctrl+Alt+Del
          </button>
        </li>
        <li>
          <button type="button" class="secondary" data-action="meta">
            Windows キー
          </button>
        </li>
        <li>
          <button type="button" class="secondary" data-action="diag">
            診断
          </button>
        </li>
        <li>
          <button type="button" class="secondary" data-action="fullscreen">
            全画面
          </button>
        </li>
        <li>
          <button type="button" class="secondary" data-action="disconnect">
            切断
          </button>
        </li>
      </ul>
    </nav>
    <!-- 初めて接続する先、または証明書が前と違うときに出す(app.ts の askCert) -->
    <dialog id="cert" aria-labelledby="cert-title" aria-describedby="cert-lead">
      <article>
        <header>
          <h2 id="cert-title"></h2>
        </header>
        <p id="cert-lead"></p>
        <dl id="cert-info"></dl>
        <footer>
          <button type="button" class="secondary" value="cancel">取消</button>
          <button type="button" value="trust"></button>
        </footer>
      </article>
    </dialog>
    <!-- Intel AMT の画面(amt/view.ts)。SOL の端末が主で、操作は上の常に出ているバー -->
    <section id="amt" hidden>
      <nav class="bar overlay pinned" id="amt-bar" data-shown>
        <ul>
          <li><strong id="amt-name"></strong><span class="kind">AMT</span></li>
          <li>
            <span id="amt-state" data-on="false"></span>
          </li>
          <li><span id="amt-status" class="note" role="status"></span></li>
        </ul>
        <ul>
          <!-- 電源の操作。いま使えるものだけ並べる。「電源オン」は 1 回押し、ほかは 2 回押しで確定する(amt/view.ts の pressPower) -->
          <li id="amt-actions"></li>
          <!-- IDE-R: 手元の ISO を CD-ROM として見せて、そこから起動させる。選ぶと確かめる窓が出る -->
          <li>
            <button type="button" class="secondary" id="ider-boot">
              ISO から起動
            </button>
            <input type="file" id="ider-file" accept=".iso" hidden />
          </li>
          <li>
            <button type="button" class="secondary" id="ider-stop" hidden>
              IDE-R を終了
            </button>
          </li>
          <!-- SOL・IDE-R の受け口(AMT_RedirectionService)が無効なときだけ出す -->
          <li>
            <button
              type="button"
              class="secondary"
              id="amt-enable-redirection"
              hidden
            >
              SOL・IDE-R を有効にする
            </button>
          </li>
          <li>
            <button type="button" class="secondary" id="amt-sol" data-amt="sol">
              SOL に接続
            </button>
          </li>
          <li>
            <button type="button" class="secondary" data-amt="close">
              閉じる
            </button>
          </li>
        </ul>
      </nav>
      <div id="sol" class="tty"></div>
    </section>
    <!-- Talos のダッシュボード(talos/view.ts)。talosctl dashboard の端末が主で、上の常に出ているバーは SOL と同じ形 -->
    <section id="talos" hidden>
      <nav class="bar overlay pinned" id="talos-bar" data-shown>
        <ul>
          <li>
            <strong id="talos-name"></strong><span class="kind">Talos</span>
          </li>
          <li><span id="talos-status" class="note" role="status"></span></li>
        </ul>
        <ul>
          <!-- 電源の操作(シャットダウン・再起動)。2 回押しで確定する(two-press.ts) -->
          <li id="talos-actions"></li>
          <!-- talosctl が終わったら出す -->
          <li>
            <button
              type="button"
              class="secondary"
              id="talos-reopen"
              data-talos="reopen"
              hidden
            >
              もう一度開く
            </button>
          </li>
          <li>
            <button type="button" class="secondary" data-talos="close">
              閉じる
            </button>
          </li>
        </ul>
      </nav>
      <div id="talos-term" class="tty"></div>
    </section>
    <!-- AMT の「ISO から起動」と「SOL・IDE-R を有効にする」の前に出す(amt/view.ts の ask) -->
    <dialog
      id="confirm"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-lead"
    >
      <article>
        <header>
          <h2 id="confirm-title"></h2>
        </header>
        <p id="confirm-lead"></p>
        <footer>
          <button type="button" class="secondary" value="cancel">取消</button>
          <button type="button" value="ok"></button>
        </footer>
      </article>
    </dialog>
    <div id="screen" class="idle"></div>
    <pre id="diag" hidden></pre>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
