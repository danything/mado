<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>mado</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<main id="home" class="container" hidden>
			<article>
				<header class="brand">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<rect x="3" y="4" width="18" height="14" rx="2" />
						<path d="M3 11h18M12 4v14M8 21h8" />
					</svg>
					<div>
						<h1>mado</h1>
						<p id="who"></p>
					</div>
				</header>
				<form id="login">
					<label id="target-field">
						<select name="target" required></select>
						<span>つなぐ先</span>
					</label>
					<label>
						<select name="size">
							<option value="auto">窓に合わせる</option>
							<option value="1920x1080">1920 × 1080</option>
							<option value="1600x900">1600 × 900</option>
							<option value="1280x720">1280 × 720(軽い)</option>
						</select>
						<span>画面の大きさ</span>
					</label>
					<label>
						<input name="username" autocomplete="username" placeholder=" " required />
						<span>Windows のユーザー名</span>
					</label>
					<label>
						<input name="password" type="password" autocomplete="current-password" placeholder=" " required />
						<span>パスワード</span>
					</label>
					<button type="submit">つなぐ</button>
					<small id="status" role="status"></small>
				</form>
				<footer>
					<small><a href="/logout">ログアウト</a> · <span id="version"></span></small>
				</footer>
			</article>
		</main>
		<nav id="toolbar" hidden>
			<ul>
				<li><strong id="current"></strong></li>
			</ul>
			<ul>
				<li><button type="button" class="secondary outline" data-action="ctrl-alt-del">Ctrl+Alt+Del</button></li>
				<li><button type="button" class="secondary outline" data-action="meta">Windows キー</button></li>
				<li><button type="button" class="secondary outline" data-action="fullscreen">全画面</button></li>
				<li><button type="button" class="contrast" data-action="disconnect">切断</button></li>
			</ul>
		</nav>
		<div id="screen" class="idle"></div>
		<script type="module" src="./app.ts"></script>
	</body>
</html>
